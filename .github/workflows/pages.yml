name: Deploy GitHub Pages

on:
  push:
    branches: [main, codex/github-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned exact runtime
        run: apps/web/fetch-exact-runtime.sh "$RUNNER_TEMP/irisu-exact-runtime"
      - name: Build static site
        env:
          IRISU_EXACT_RUNTIME_DIR: ${{ runner.temp }}/irisu-exact-runtime
        run: apps/web/build-static.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
