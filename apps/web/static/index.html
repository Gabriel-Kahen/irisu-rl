<!doctype html>
<html lang="en" data-ready="false">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070a0b">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self'; connect-src 'self'">
  <title>irisu</title>
  <link rel="stylesheet" href="./styles.css?v=20260809f">
  <link rel="preload" href="./exact-runtime/v86.wasm?v=20260809j" as="fetch" type="application/wasm" crossorigin>
  <link rel="preload" href="./exact-runtime/buildroot-bzimage68.bin?v=20260809j" as="fetch" crossorigin>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand">irisu</div>
      <div class="header-actions">
        <button id="openReplayButton" type="button" disabled>play replay</button>
        <input id="replayFileInput" type="file" accept=".rpy,application/octet-stream" hidden>
        <button id="pauseButton">pause <kbd>space</kbd></button>
        <button id="restartButton">restart <kbd>R</kbd></button>
      </div>
    </header>

    <div class="layout">
      <section class="game-frame">
        <canvas id="game" width="640" height="480" aria-label="IriSu game field"></canvas>
        <div id="runtimeLoading" class="runtime-loading" role="status" aria-live="polite" aria-atomic="true">
          <div class="runtime-spinner" aria-hidden="true"></div>
          <strong>LOADING EMULATOR...</strong>
        </div>
        <div id="gameOver" class="modal" hidden>
          <span class="modal-kicker">RUN COMPLETE</span>
          <h1 id="finalTitle">Game over</h1>
          <p id="finalScore">00000000</p>
          <div class="modal-actions">
            <button id="saveReplayButton" type="button">save replay (.rpy)</button>
            <button id="againButton" type="button" class="primary">try again</button>
          </div>
        </div>
        <div id="paused" class="pause-mark" hidden>PAUSED</div>
      </section>

      <section id="replayControls" class="replay-controls" aria-label="Replay playback controls" hidden>
        <div class="replay-meta">
          <strong id="replayName">Replay</strong>
          <span id="replayStatus"></span>
          <span id="replayAnnouncement" class="visually-hidden" role="status" aria-live="polite"></span>
        </div>
        <div class="replay-transport">
          <button id="replayPlayButton" type="button">pause</button>
          <button id="replayBackButton" type="button" aria-label="Jump back 5 seconds">−5s <kbd>←</kbd></button>
          <button id="replayForwardButton" type="button" aria-label="Jump forward 5 seconds">+5s <kbd>→</kbd></button>
          <label class="replay-speed" for="replaySpeed">speed
            <select id="replaySpeed">
              <option value="1">1x</option>
              <option value="2">2x</option>
              <option value="4">4x</option>
              <option value="8">8x</option>
            </select>
          </label>
          <label class="visually-hidden" for="replayScrubber">Replay position</label>
          <input id="replayScrubber" class="replay-scrubber" type="range" min="0" max="0" value="0" step="1">
          <output id="replayPosition" for="replayScrubber">frame 0 / 0</output>
          <button id="exitReplayButton" type="button">new game</button>
        </div>
        <div id="replayError" class="replay-error" role="alert" hidden></div>
      </section>

    </div>
    <div id="appError" class="app-error" role="alert" hidden></div>
  </main>
  <div id="toast" class="toast"></div>
  <script type="module" src="./app.js?v=20260809n"></script>
</body>
</html>
